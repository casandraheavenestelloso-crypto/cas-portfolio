<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      Contact — CAS
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=26">
    <link rel="stylesheet" href="css/fixes.css">
    <link rel="stylesheet" href="css/responsive.css?v=44">
  </head>
  <body data-page="contact">
    <main id="main-content">
      <section class="contact-page container">
        <div class="contact-intro reveal">
          <p class="eyebrow">
            Have a project in mind?
          </p>
          <h1>
            Let’s Work
            <span>
            Together.
            </span>
          </h1>
          <p>
Have a store, website, or fresh idea? Let’s build a responsive experience that works across mobile, tablet, and desktop.          </p>
          <a class="email-link" href="mailto:casandraheavenestelloso@gmail.com">
          Get in Touch
          <i class="fa-solid fa-arrow-up-right-from-square">
          </i>
          </a>
          <div class="socials">
            <a href="[SOCIAL MEDIA URL]" aria-label="LinkedIn profile">
            <i class="fa-brands fa-linkedin-in">
            </i>
            </a>
            <a href="[SOCIAL MEDIA URL]" aria-label="Instagram profile">
            <i class="fa-brands fa-instagram">
            </i>
            </a>
          </div>
        </div>
        <form class="contact-form reveal" novalidate>
          <div class="form-row">
            <div class="field">
              <label for="name">
              Full name
              </label>
              <input id="name" name="name" autocomplete="name" required>
              <small>
              </small>
            </div>
            <div class="field">
              <label for="email">
              Email address
              </label>
              <input id="email" name="email" type="email" autocomplete="email" required>
              <small>
              </small>
            </div>
          </div>
          <div class="field">
            <label for="subject">
            Subject
            </label>
            <input id="subject" name="subject" required>
            <small>
            </small>
          </div>
          <div class="field">
            <label for="message">
            Tell me about your project
            </label>
            <textarea id="message" name="message" rows="6" required>
            </textarea>
            <small>
            </small>
          </div>
          <button class="button" type="submit">
          Send inquiry
          <i class="fa-solid fa-arrow-right">
          </i>
          </button>
          <p class="form-feedback" role="status" aria-live="polite">
          </p>
        </form>
      </section>
    </main>
    <script src="js/components.js?v=26"></script>
    <script src="js/script.js?v=27">
    </script>
  </body>
</html>
